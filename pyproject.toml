[project]
name = "datetime-normalizer"
version = "0.1.0"
description = "Normalize free-form date and time text, including Japanese notation, without losing its precision."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.20",
    "hypothesis>=6.170",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datetime_normalizer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ISC",
    "D", "FBT", "PT", "C4", "PIE", "RET", "PERF",
]
ignore = ["ISC003", "RUF001", "RUF002", "RUF003", "D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "FBT001"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.basedpyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "recommended"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
